<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT 7th Grade  — Teacher Narankhuu B</title>
    <style>
        /* ==========================================================================
           1. CSS VARIABLES & RESET (100% OFFLINE STANDALONE STYLES)
           ========================================================================== */
        :root {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --bg-subtle: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --emerald: #059669;
            --emerald-hover: #047857;
            --emerald-light: #ecfdf5;
            --rose: #e11d48;
            --rose-hover: #be123c;
            --rose-light: #fff1f2;
            --amber: #d97706;
            --amber-light: #fffbeb;
            --cyan: #0891b2;
            --cyan-light: #ecfeff;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.12);
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #eef2ff 0%, #f1f5f9 50%, #ecfdf5 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .mono {
            font-family: var(--font-mono);
        }

        /* ==========================================================================
           2. HEADER & NAVIGATION
           ========================================================================== */
        .app-header {
            background: linear-gradient(90deg, #0f172a 0%, #1e1b4b 55%, #0f172a 100%);
            color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 40;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: var(--shadow-md);
        }

        .header-inner {
            max-width: 1360px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #06b6d4, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            font-family: var(--font-mono);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.45);
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .igcse-pill {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: rgba(56, 189, 248, 0.2);
            color: #7dd3fc;
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 2px 8px;
            border-radius: 999px;
        }

        .brand-sub {
            font-size: 11px;
            color: #94a3b8;
        }

        .header-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .header-select, .header-btn {
            border-radius: 11px;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .header-select {
            background: rgba(30, 41, 59, 0.9);
            color: #f8fafc;
            outline: none;
            max-width: 210px;
        }

        .header-btn-lang {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        .header-btn-lang:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .header-btn-admin {
            background: #4f46e5;
            color: #ffffff;
            border-color: #6366f1;
        }

        .header-btn-admin:hover {
            background: #4338ca;
        }

        .header-btn-admin.unlocked {
            background: #059669;
            border-color: #10b981;
        }

        .header-btn-icon {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 8px 10px;
            font-size: 14px;
        }

        /* Navigation Tabs */
        .nav-bar-wrap {
            max-width: 1360px;
            margin: 16px auto 0;
            padding: 0 16px;
        }

        .nav-bar {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 6px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            box-shadow: var(--shadow-sm);
        }

        .nav-tab {
            padding: 10px 14px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.18s ease;
        }

        .nav-tab:hover {
            background: #f1f5f9;
            color: var(--text-primary);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.28);
        }

        .nav-tab-logout {
            margin-left: auto;
            background: rgba(225, 29, 72, 0.1);
            color: #e11d48;
            border: 1px solid rgba(225, 29, 72, 0.2);
        }
        .nav-tab-logout:hover {
            background: rgba(225, 29, 72, 0.2);
            color: #be123c;
        }

        /* ==========================================================================
           3. MAIN CONTAINER & CARDS
           ========================================================================== */
        .main-container {
            max-width: 1360px;
            margin: 18px auto 40px;
            padding: 0 16px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 22px;
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .card-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-subtitle {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Buttons & Inputs */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.16s ease;
            font-family: inherit;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #2563eb);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #4338ca, #1d4ed8);
            transform: translateY(-1px);
        }

        .btn-emerald {
            background: var(--emerald);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
        }

        .btn-emerald:hover:not(:disabled) {
            background: var(--emerald-hover);
            transform: translateY(-1px);
        }

        .btn-rose {
            background: var(--rose);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.22);
        }

        .btn-rose:hover:not(:disabled) {
            background: var(--rose-hover);
        }

        .btn-amber {
            background: #f59e0b;
            color: #0f172a;
        }

        .btn-amber:hover:not(:disabled) {
            background: #d97706;
            color: #ffffff;
        }

        .btn-outline {
            background: #ffffff;
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-outline:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .btn-sm {
            padding: 6px 11px;
            font-size: 11.5px;
            border-radius: 9px;
        }

        .input, .select, .textarea {
            width: 100%;
            padding: 10px 13px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 13px;
            font-family: inherit;
            color: var(--text-primary);
            background: #ffffff;
            outline: none;
            transition: border-color 0.15s;
        }

        .input:focus, .select:focus, .textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 800;
        }

        .badge-indigo { background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; }
        .badge-emerald { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .badge-amber { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
        .badge-rose { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
        .badge-slate { background: #f1f5f9; color: #334155; }

        /* ==========================================================================
           4. DUAL SPINNING WHEEL STAGE
           ========================================================================== */
        .wheel-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: #f8fafc;
            padding: 14px 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            margin-bottom: 18px;
        }

        .class-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .pill-btn {
            padding: 6px 13px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }

        .pill-btn.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        .wheels-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 920px) {
            .wheels-grid {
                grid-template-columns: 1fr;
            }
        }

        .wheel-box {
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .wheel-box.highlighted {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .wheel-box-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .wheel-badge-count {
            font-size: 11.5px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--primary-light);
            color: var(--primary);
        }

        .wheel-svg-stage {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0 14px;
        }

        .wheel-pointer {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 28px solid #f59e0b;
            filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35));
        }

        .wheel-pointer::after {
            content: '';
            position: absolute;
            top: -31px;
            left: -7px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #0f172a;
        }

        .wheel-svg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.18), inset 0 0 0 6px #ffffff;
            will-change: transform;
        }

        .wheel-empty {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 3px dashed #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            background: #f8fafc;
        }

        .spin-master-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .btn-spin-both {
            padding: 15px 30px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 16px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            color: #ffffff;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(124, 58, 237, 0.35);
            transition: transform 0.18s, box-shadow 0.18s;
        }

        .btn-spin-both:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 28px rgba(124, 58, 237, 0.45);
        }

        .btn-spin-both:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Active Challenge Panel */
        .challenge-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-lg);
            border: 2px solid #4f46e5;
            animation: popIn 0.28s ease;
        }

        .challenge-pair-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
            margin-bottom: 18px;
        }

        .selected-student-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(16, 185, 129, 0.18);
            border: 1px solid rgba(16, 185, 129, 0.45);
            padding: 8px 14px;
            border-radius: 14px;
        }

        .selected-question-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.25);
            border: 1px solid rgba(129, 140, 248, 0.45);
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 12.5px;
            font-weight: 700;
        }

        .challenge-q-text {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 6px;
            color: #f8fafc;
        }

        .challenge-q-en {
            font-size: 13.5px;
            color: #93c5fd;
            font-style: italic;
            margin-bottom: 18px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }

        @media (max-width: 680px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 13px 16px;
            border-radius: 14px;
            text-align: left;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.15s;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(99, 102, 241, 0.35);
            border-color: #818cf8;
        }

        .option-btn.correct {
            background: rgba(5, 150, 105, 0.45);
            border-color: #34d399;
            color: #ecfdf5;
        }

        .option-btn.wrong {
            background: rgba(225, 29, 72, 0.45);
            border-color: #fb7185;
        }

        .option-letter {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            flex-shrink: 0;
        }

        .oral-grading-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: rgba(255, 255, 255, 0.07);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px dashed rgba(255, 255, 255, 0.22);
        }

        /* Pool Management & Eliminated Lists */
        .pool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        @media (max-width: 820px) {
            .pool-grid {
                grid-template-columns: 1fr;
            }
        }

        .pool-panel {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
        }

        .chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 10px;
        }

        .elim-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .elim-chip button {
            background: #059669;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* ==========================================================================
           5. TABLES, ANALYTICS & LABS
           ========================================================================== */
        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #f8fafc;
            color: var(--text-secondary);
            font-weight: 800;
            text-align: left;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 11px 14px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }

        tr:hover td {
            background: #f8fafc;
        }

        tr.active-student-row td {
            background: #ecfdf5;
        }

        .progress-track {
            width: 100%;
            max-width: 130px;
            height: 7px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .kpi-grid {
                grid-template-columns: 1fr;
            }
        }

        .kpi-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            box-shadow: var(--shadow-sm);
        }

        .kpi-label {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .kpi-val {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            margin: 4px 0;
        }

        .kpi-trend {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--emerald);
        }

        /* Modals & Toasts */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-card {
            background: #ffffff;
            border-radius: var(--radius-xl);
            max-width: 580px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            animation: popIn 0.22s ease;
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 70;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            box-shadow: var(--shadow-lg);
            display: flex;

           1. WEB AUDIO API SOUND ENGINE (ZERO EXTERNAL FILES)

        const SoundFX = {
            ctx: null,
            muted: false,
            init() {
                if (this.muted) return;
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            tick() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(760, now);
                osc.frequency.exponentialRampToValueAtTime(320, now + 0.035);
                gain.gain.setValueAtTime(0.09, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.035);
            },
            fanfare() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.18, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.36);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.36);
                });
            },
            buzzer() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(175, now);
                osc.frequency.exponentialRampToValueAtTime(95, now + 0.34);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.34);
            }
        };

        /* ==========================================================================

           ========================================================================== */
        const STORAGE_KEY = 'grade7_cs_360_v2';

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return {
                        ...DEFAULT_STATE,
                        ...parsed,
                        jeopardyTeams: parsed.jeopardyTeams || DEFAULT_STATE.jeopardyTeams,
                        jeopardyBoard: parsed.jeopardyBoard || DEFAULT_STATE.jeopardyBoard,
                        keywords: parsed.keywords || DEFAULT_STATE.keywords,
                        masteredKeywordIds: parsed.masteredKeywordIds || DEFAULT_STATE.masteredKeywordIds,
                        factChecks: parsed.factChecks || DEFAULT_STATE.factChecks,
                        analytics: {
                            ...DEFAULT_STATE.analytics,
                            ...(parsed.analytics || {}),
                            moduleUsage: { ...DEFAULT_STATE.analytics.moduleUsage, ...(parsed.analytics?.moduleUsage || {}) }
                        }
                    };
                }
            } catch (e) {
                console.error('Failed to load state:', e);
            }
            return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }

        let state = loadState();
        state.analytics.totalViews = (state.analytics.totalViews || 0) + 1;
        state.analytics.dailyTraffic[state.analytics.dailyTraffic.length - 1].views += 1;

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error('Failed to save state:', e);
            }
        }
        saveState();

        /* ==========================================================================
           3.1 LOGIN AND AUTH FUNCTIONS
           ========================================================================== */
        function handleStudentLogin(e) {
            e.preventDefault();
            const cls = document.getElementById('loginClassSel').value;
            const name = document.getElementById('loginNameInput').value.trim();
            if(!name) return;

            let st = state.students.find(s => s.name.toLowerCase() === name.toLowerCase() && s.className === cls);
            if (!st) {
                const nextId = 'stu_' + Date.now();
                st = {
                    id: nextId,
                    name: name,
                    className: cls,
                    participation: 0,
                    labPoints: 0,
                    ictPoints: 0,
                    history: []
                };
                state.students.push(st);
                saveState();
            }

            ui.activeStudentId = st.id;
            ui.loginRole = 'student';
            ui.view = 'app';
            ui.activeTab = 'keywords';
            showToast(`Амжилттай нэвтэрлээ, ${st.name}!`);
            render();
        }

        function handleTeacherLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('loginPinInput').value;
            if (pin === (state.adminPin || '1234')) {
                ui.loginRole = 'teacher';
                ui.view = 'app';
                ui.activeTab = 'wheel';
                ui.adminUnlocked = true;
                sessionStorage.setItem('grade7_admin', 'true');
                showToast('Багшийн эрхээр амжилттай нэвтэрлээ!');
                render();
            } else {
                SoundFX.buzzer();
                ui.pinError = 'PIN код буруу байна! (Анхны код: 1234)';
                render();
            }
        }

        /* ==========================================================================
           4. CORE HELPERS (ESCAPING, TOASTS, POINTS, ANALYTICS & SVG WHEELS)
           ========================================================================== */
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(message, type = 'success') {
            const root = document.getElementById('toast-root');
            if (!root) return;
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            root.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(8px)';
                toast.style.transition = 'all 0.2s ease';
                setTimeout(() => toast.remove(), 220);
            }, 3100);
        }

        function openConfirm(title, message, onConfirm) {
            ui.confirmModal = { title, message, onConfirm };
            render();
        }

        function getTotalPoints(st) {
            return (st.participation || 0) + (st.labPoints || 0) + (st.ictPoints || 0);
        }

        function getBonusGrade(totalPts) {
            const per = Math.max(1, Number(state.pointsPerBonus) || 50);
            const max = Math.max(0, Number(state.maxBonus) || 10);
            return Number(Math.min(max, totalPts / per).toFixed(1));
        }

        function awardStudentPoints(studentId, delta, category = 'lab', reason = 'МТ-ийн даалгавар') {
            const st = state.students.find(s => s.id === studentId);
            if (!st) return;

            if (category === 'participation') {
                st.participation = Math.max(0, (st.participation || 0) + delta);

            const todayBucket = state.analytics.dailyTraffic?.[state.analytics.dailyTraffic.length - 1];

        const WHEEL_COLORS = [
            '#4f46e5', '#059669', '#0891b2', '#d97706', '#e11d48',
            '#7c3aed', '#2563eb', '#0d9488', '#db2777', '#ea580c'
        ];

        function buildSvgWheelMarkup(items, labelFn, angleDeg, svgId) {
            const size = 320;
            const cx = size / 2;
            const cy = size / 2;
            const r = 150;
            const count = items.length;
            const sliceDeg = 360 / count;

            let slicesSvg = '';
            for (let i = 0; i < count; i++) {
                const startDeg = i * sliceDeg;
                const endDeg = startDeg + sliceDeg;
                const midDeg = startDeg + sliceDeg / 2;
                const color = WHEEL_COLORS[i % WHEEL_COLORS.length];
                const rawLabel = String(labelFn(items[i]) || '');
                const shortLabel = rawLabel.length > 16 ? rawLabel.slice(0, 15) + '…' : rawLabel;

                if (count === 1) {
                    slicesSvg += `
                        <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="#ffffff" stroke-width="2.5" />
                        <text x="${cx}" y="${cy - 45}" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">${escapeHtml(shortLabel)}</text>
                    `;
                } else {
                    const startRad = (startDeg * Math.PI) / 180;
                    const endRad = (endDeg * Math.PI) / 180;
                    const x1 = cx + r * Math.cos(startRad);
                    const y1 = cy + r * Math.sin(startRad);
                    const x2 = cx + r * Math.cos(endRad);
                    const y2 = cy + r * Math.sin(endRad);
                    const largeArc = sliceDeg > 180 ? 1 : 0;

                    slicesSvg += `
                        <path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z"
                              fill="${color}" stroke="#ffffff" stroke-width="2" />
                        <g transform="translate(${cx}, ${cy}) rotate(${midDeg})">
                            <text x="${r - 14}" y="4" fill="#ffffff" font-size="${count > 12 ? 10 : 11.5}" font-weight="800" text-anchor="end">
                                ${escapeHtml(shortLabel)}
                            </text>
                        </g>
                    `;
                }
            }

            return `
                <svg id="${svgId}" class="wheel-svg" viewBox="0 0 ${size} ${size}" style="transform: rotate(${angleDeg}deg);">
                    ${slicesSvg}
                    <circle cx="${cx}" cy="${cy}" r="22" fill="#0f172a" stroke="#ffffff" stroke-width="4" />
                    <circle cx="${cx}" cy="${cy}" r="7" fill="#38bdf8" />
                </svg>
            `;
        }

        function animateWheelSpin({ which, items, onComplete }) {
            if (!items || items.length === 0) return;
            const isStudent = which === 'student';
            if (isStudent) ui.isSpinningStudent = true;
            else ui.isSpinningQuestion = true;

            const count = items.length;
            const sliceDeg = 360 / count;
            const targetIdx = Math.floor(Math.random() * count);

            const targetCenterDeg = (targetIdx + 0.5) * sliceDeg;
            const jitter = (Math.random() - 0.5) * (sliceDeg * 0.45);
            const desiredMod = (((270 - (targetCenterDeg + jitter)) % 360) + 360) % 360;

            const startAngle = isStudent ? ui.studentWheelAngle : ui.questionWheelAngle;
            const currentMod = ((startAngle % 360) + 360) % 360;
            const deltaMod = (desiredMod - currentMod + 360) % 360;
            const totalRotation = 5 * 360 + deltaMod;
            const finalAngle = startAngle + totalRotation;

            const duration = 2700;
            const startTime = performance.now();
            let lastSlicePassed = -1;
            const svgId = isStudent ? 'svg-student-wheel' : 'svg-question-wheel';

            function step(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / duration);
                const eased = 1 - Math.pow(1 - progress, 3);
                const currentAngle = startAngle + totalRotation * eased;

                const svgEl = document.getElementById(svgId);
                if (svgEl) {
                    svgEl.style.transform = `rotate(${currentAngle}deg)`;
                }

                const slicePassed = Math.floor(currentAngle / sliceDeg);
                if (slicePassed !== lastSlicePassed) {
                    lastSlicePassed = slicePassed;
                    SoundFX.tick();
                }

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    if (isStudent) {
                        ui.studentWheelAngle = finalAngle;
                        ui.isSpinningStudent = false;
                    } else {
                        ui.questionWheelAngle = finalAngle;
                        ui.isSpinningQuestion = false;
                    }
                    onComplete(items[targetIdx]);
                }
            }

            requestAnimationFrame(step);
        }

            ui.matchMatchedIds = [];

        function handleMatchTermClick(id) {
            if (ui.matchMatchedIds.includes(id)) return;
            SoundFX.tick();
            ui.matchSelectedTermId = id;
            ui.matchWrongDefId = null;
            render();
        }

        function handleMatchDefClick(id) {
            if (!ui.matchSelectedTermId || ui.matchMatchedIds.includes(id)) return;
            if (ui.matchSelectedTermId === id) {
                SoundFX.tick();
                ui.matchMatchedIds.push(id);
                ui.matchSelectedTermId = null;
                if (ui.matchMatchedIds.length === ui.matchPairs.length) {
                    ui.matchCompleted = true;
                    ui.matchElapsedSec = Math.floor((Date.now() - ui.matchStartTime) / 1000);
                    SoundFX.fanfare();

                        `).join('')}

                                <div class="jeopardy-cat-header">${escapeHtml(cat.category)}</div>
                            `).join('')}

                                state.jeopardyBoard.map((cat, catIdx) => {
                                    const q = cat.questions[rowIdx];
                                    return `
                                        <button class="jeopardy-tile ${q.used ? 'used' : ''}" ${q.used ? 'disabled' : ''} onclick="openJeopardyTile(${catIdx}, ${rowIdx})">

            `;
        }

        function adjustJeopardyTeam(idx, delta) {
            state.jeopardyTeams[idx].score += delta;
            if (delta > 0) SoundFX.tick(); else SoundFX.buzzer();
            saveState();
            render();
        }

        function openJeopardyTile(catIdx, qIdx) {
            SoundFX.tick();
            ui.jeopardyModal = {
                catIdx,
                qIdx,
                showHint: false,
                showAnswer: false,
                awardStudentId: ui.activeStudentId || ''
            };
            render();
        }

        function completeJeopardyTile(teamIdx) {
            if (!ui.jeopardyModal) return;
            const { catIdx, qIdx, awardStudentId } = ui.jeopardyModal;
            const q = state.jeopardyBoard[catIdx].questions[qIdx];
            q.used = true;

            if (teamIdx !== null && teamIdx >= 0) {
                state.jeopardyTeams[teamIdx].score += q.points;
                SoundFX.fanfare();
                triggerBurst();
                recordAttempt(true, 'jeopardy');
                const tmName = state.jeopardyTeams[teamIdx].name;
                let msg = `🏆 ${tmName} +${q.points} Jeopardy оноо авлаа!`;
                if (awardStudentId) {
                    const bonusIct = Math.round(q.points / 20);
                    awardStudentPoints(awardStudentId, bonusIct, 'participation', `Jeopardy (${q.points}) багтаа оноо авчирсан`);
                    const st = state.students.find(s => s.id === awardStudentId);
                    if (st) msg += ` (${st.name} +${bonusIct} оноо)`;
                }
                showToast(msg);
            } else {
                SoundFX.buzzer();
                recordAttempt(false, 'jeopardy');
            }

            ui.jeopardyModal = null;
            saveState();
            render();
        }

        function resetJeopardyBoard() {
            openConfirm('Jeopardy самбарыг шинэчлэх үү?', 'Бүх нээгдсэн нүднүүд болон багуудын Jeopardy оноо 0 болно.', () => {
                state.jeopardyTeams.forEach(t => t.score = 0);
                state.jeopardyBoard.forEach(cat => cat.questions.forEach(q => q.used = false));
                saveState();
                showToast('Jeopardy самбар шинэчлэгдлээ!');
                render();
            });
        }

        function exportLeaderboardCsv() {
            const headers = ['Байр', 'Анги', 'Сурагчийн нэр', 'Идэвхийн оноо', 'Лаб ба Сорил', 'ICT оноо', 'Нийт оноо', 'Нэмэлт дүн'];
            const sorted = [...state.students]
                .filter(s => ui.lbClassFilter === 'ALL' || s.className === ui.lbClassFilter)
                .sort((a, b) => getTotalPoints(b) - getTotalPoints(a));

            const rows = sorted.map((s, i) => {
                const tot = getTotalPoints(s);
                return [i + 1, s.className, `"${s.name}"`, s.participation || 0, s.labPoints || 0, s.ictPoints || 0, tot, getBonusGrade(tot)].join(',');
            });

            const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n'); // Add BOM for UTF-8 Excel support
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `7_r_angi_Onoo_${ui.lbClassFilter}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Excel (.CSV) тайлан амжилттай татагдлаа!');
        }

        function promptEditScore(studentId, field, label) {

            if (input !== null && input.trim() !== '') {
                const num = parseInt(input, 10);
                if (!isNaN(num)) {
                    st[field] = Math.max(0, num);
                    saveState();
                    showToast(`${label} оноо амжилттай засагдлаа!`);
                    render();
                } else {
                    showToast('Зөвхөн тоо оруулна уу!', 'error');

        function submitRocketAnswer() {
            const list = state.questions;
            const q = list[ui.rocketQIdx % list.length];
            if (ui.rocketSelectedOpt === null || ui.rocketSubmitted) return;

            ui.rocketSubmitted = true;
            const isCorrect = ui.rocketSelectedOpt === q.correct;
            recordAttempt(isCorrect, 'rocket');

            if (isCorrect) {
                ui.rocketAltitude += 50;
                SoundFX.fanfare();
                if (ui.activeStudentId) {
                    awardStudentPoints(ui.activeStudentId, 10, 'lab', `Пуужин хөөргөсөн`);
                    showToast('🎉 Зөв! Пуужин дээшиллээ (+10 оноо).');
                } else {
                    showToast('🎉 Зөв! Пуужин амжилттай хөөрч байна.');
                }
            } else {
                SoundFX.buzzer();
                ui.rocketAltitude = Math.max(20, ui.rocketAltitude - 10);
                ui.rocketWrongShake = true;
                showToast('Буруу хариуллаа! Пуужингийн хөдөлгүүр доголдлоо.', 'error');
                
                setTimeout(() => {
                    ui.rocketWrongShake = false;
                    render();
                }, 500);
            }
            render();
        }

        /* --------------------------------------------------------------------------
           MODULE 7: ANALYTICS DASHBOARD
           -------------------------------------------------------------------------- */
        function renderAnalyticsModule() {
            const totalPts = state.students.reduce((sum, s) => sum + getTotalPoints(s), 0);
            const activeStus = state.students.filter(s => getTotalPoints(s) >= 40).length;
            const acc = state.analytics.totalAttempts > 0
                ? Math.round((state.analytics.correctAnswers / state.analytics.totalAttempts) * 100)
                : 84;

            const traffic = state.analytics.dailyTraffic || [];
            const maxViews = Math.max(10, ...traffic.map(d => d.views));
            const svgW = 640, svgH = 210, padL = 36, padR = 16, padT = 18, padB = 30;
            const plotW = svgW - padL - padR;
            const plotH = svgH - padT - padB;
            const pts = traffic.map((d, i) => {
                const x = padL + (traffic.length <= 1 ? plotW / 2 : (i / (traffic.length - 1)) * plotW);
                const y = padT + plotH - (d.views / maxViews) * plotH;
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');

            const mu = state.analytics.moduleUsage || {};
            const modBars = [
                { name: '🎡 Давхар Санамсаргүй Хүрд', val: mu.wheel || 0, color: '#4f46e5' },
                { name: '🏆 Алтан Хонх (Jeopardy)', val: mu.jeopardy || 0, color: '#059669' },
                { name: '🃏 Keyword & Эвлүүлэг', val: mu.keywords || 0, color: '#0891b2' },
                { name: '⚡ Интерактив Лаб', val: mu.labs || 0, color: '#d97706' },
                { name: '🎯 Жишиг Тест (MCQ)', val: mu.quiz || 0, color: '#7c3aed' },
                { name: '🔍 Үнэн / Худал', val: mu.factcheck || 0, color: '#e11d48' }
            ];
            const maxMod = Math.max(1, ...modBars.map(m => m.val));

            return `
                <div>
                    <div class="kpi-grid">
                        <div class="kpi-card">
                            <div class="kpi-label">Нийт хандалт (Views)</div>
                            <div class="kpi-val">${state.analytics.totalViews}</div>
                            <div class="kpi-trend">▲ 7A, 7B нэгдсэн</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">Идэвхтэй сурагчид</div>
                            <div class="kpi-val">${activeStus} / ${state.students.length}</div>
                            <div class="kpi-trend">40+ оноотой сурагчид</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">Олгосон нийт оноо</div>
                            <div class="kpi-val">${totalPts}</div>
                            <div class="kpi-trend">Дундаж: ${Math.round(totalPts / Math.max(1, state.students.length))} оноо</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">Зөв хариултын хувь</div>
                            <div class="kpi-val">${acc}%</div>
                            <div class="kpi-trend">${state.analytics.correctAnswers} / ${state.analytics.totalAttempts} оролдлого</div>
                        </div>
                    </div>

                    <div class="pool-grid" style="margin-bottom:18px;">
                        <div class="card">
                            <h3 style="font-size:16px; font-weight:800; margin-bottom:10px;">📈 Сүүлийн хандалт</h3>
                            <svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%; height:auto;">
                                <polyline fill="none" stroke="#4f46e5" stroke-width="3" points="${pts}" />
                                ${traffic.map((d, i) => {
                                    const x = padL + (traffic.length <= 1 ? plotW / 2 : (i / (traffic.length - 1)) * plotW);
                                    const y = padT + plotH - (d.views / maxViews) * plotH;
                                    return `
                                        <circle cx="${x}" cy="${y}" r="4.5" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5" />
                                        ${i % 2 === 0 || i === traffic.length - 1 ? `<text x="${x}" y="${svgH - 8}" font-size="10" fill="#64748b" text-anchor="middle">${escapeHtml(d.day)}</text>` : ''}
                                    `;
                                }).join('')}
                            </svg>
                        </div>

                        <div class="card">
                            <h3 style="font-size:16px; font-weight:800; margin-bottom:12px;">🧩 Модуль тус бүрийн ашиглалт</h3>
                            ${modBars.map(m => `
                                <div style="margin-bottom:10px;">
                                    <div style="display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; margin-bottom:3px;">
                                        <span>${m.name}</span>
                                        <span>${m.val}</span>
                                    </div>
                                    <div style="height:8px; background:#f1f5f9; border-radius:999px; overflow:hidden;">
                                        <div style="height:100%; width:${Math.round((m.val / maxMod) * 100)}%; background:${m.color};"></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="card">
                        <h3 style="font-size:16px; font-weight:800; margin-bottom:10px;">⚡ Сүүлийн үйлдлүүдийн түүх (Live Activity Stream)</h3>

                                    <span style="font-weight:700;">${escapeHtml(item.text)}</span>
                                    <span style="color:#64748b; font-size:11.5px;">${escapeHtml(item.time)}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleAdminPinSubmit(e) {
            e.preventDefault();
            const val = document.getElementById('adminPinInput').value;
            if (val === (state.adminPin || '1234')) {
                ui.adminUnlocked = true;
                ui.pinError = '';
                sessionStorage.setItem('grade7_admin', 'true');
                showToast('Багшийн админ хэсэгт нэвтэрлээ!');
                render();
            } else {
                SoundFX.buzzer();
                ui.pinError = 'PIN код буруу байна! (Анхны код: 1234)';
                render();
            }
        }

        function handleBulkAddStudents(e) {
            e.preventDefault();
            const cls = document.getElementById('bulkClsSel').value;
            const names = document.getElementById('bulkNamesTxt').value.split('\n').map(x => x.trim()).filter(Boolean);
            names.forEach((name, idx) => {
                state.students.push({
                    id: 'stu_' + Date.now() + '_' + idx,
                    name,
                    className: cls,
                    participation: 0,
                    labPoints: 0,
                    ictPoints: 0,
                    history: []
                });
            });
            saveState();
            showToast(`${cls} ангид ${names.length} сурагч бүртгэгдлээ!`);
            document.getElementById('bulkNamesTxt').value = '';
            render();
        }

        function handleSaveFormula(e) {
            e.preventDefault();
            state.pointsPerBonus = Math.max(5, Number(document.getElementById('admPerBonus').value) || 50);
            state.maxBonus = Math.max(1, Number(document.getElementById('admMaxBonus').value) || 10);
            saveState();
            showToast('Улирлын нэмэлт дүнгийн томьёо шинэчлэгдлээ!');
            render();
        }

        function deleteStudent(id) {
            openConfirm('Сурагчийг устгах уу?', 'Энэ сурагчийн оноо болон бүртгэл бүрмөсөн устана.', () => {
                state.students = state.students.filter(s => s.id !== id);
                if (ui.activeStudentId === id) ui.activeStudentId = '';
                saveState();
                showToast('Сурагч устгагдлаа.', 'info');
                render();
            });
        }

        function deleteClass() {
            const cls = document.getElementById('deleteClsSel').value;
            if (!cls) return;
            openConfirm(`"${cls}" ангийг бүрмөсөн устгах уу?`, `Энэ ангийн БҮХ сурагчид, тэдний оноо болон түүх устгагдана. Болгоомжтой хандана уу!`, () => {
                state.classes = state.classes.filter(c => c !== cls);
                state.students = state.students.filter(s => s.className !== cls);
                if (ui.wheelClass === cls) ui.wheelClass = 'ALL';
                if (ui.lbClassFilter === cls) ui.lbClassFilter = 'ALL';
                if (ui.globalClassFilter === cls) ui.globalClassFilter = 'ALL';
                
                const st = state.students.find(s => s.id === ui.activeStudentId);
                if (!st) ui.activeStudentId = '';

                saveState();
                showToast(`${cls} анги болон сурагчид бүрэн устгагдлаа!`);
                render();
            });
        }

        function handleAddOrEditQuestion(e) {
            e.preventDefault();
            
            const qData = {
                paper: document.getElementById('nqPaper').value,
                topic: document.getElementById('nqTopic').value.trim(),
                questionMn: document.getElementById('nqMn').value.trim(),
                questionEn: document.getElementById('nqEn').value.trim(),
                options: [
                    document.getElementById('nqOpt0').value.trim(),
                    document.getElementById('nqOpt1').value.trim(),
                    document.getElementById('nqOpt2').value.trim(),
                    document.getElementById('nqOpt3').value.trim()
                ],
                correct: Number(document.getElementById('nqCorrect').value),
                hint: document.getElementById('nqHint').value.trim(),
                explanation: document.getElementById('nqExp').value.trim()
            };

            if (ui.adminEditQuestionId) {
                const idx = state.questions.findIndex(q => q.id === ui.adminEditQuestionId);
                if (idx !== -1) {
                    state.questions[idx] = { ...state.questions[idx], ...qData };
                    showToast('Асуулт амжилттай шинэчлэгдлээ!');
                }
                ui.adminEditQuestionId = null;
            } else {
                const nextId = state.questions.reduce((m, q) => Math.max(m, q.id), 0) + 1;
                state.questions.push({ id: nextId, ...qData });
                showToast('Шинэ асуулт нэмэгдлээ!');
            }
            saveState();
            render();
        }

        function deleteQuestion(id) {
            state.questions = state.questions.filter(q => q.id !== id);
            state.eliminatedQuestionIds = state.eliminatedQuestionIds.filter(x => x !== id);
            saveState();
            showToast('Асуулт устгагдлаа.', 'info');
            render();
        }

        function handleAddOrEditFact(e) {
            e.preventDefault();
            const fData = {
                topic: document.getElementById('nfTopic').value.trim(),
                statementMn: document.getElementById('nfMn').value.trim(),
                statementEn: document.getElementById('nfEn').value.trim(),
                isTrue: document.getElementById('nfTruth').value === 'true',
                explanation: document.getElementById('nfExp').value.trim()
            };

            if (ui.adminFactEditId) {
                const idx = state.factChecks.findIndex(f => f.id === ui.adminFactEditId);
                if (idx !== -1) state.factChecks[idx] = { ...state.factChecks[idx], ...fData };
                ui.adminFactEditId = null;
                showToast('Баримт амжилттай шинэчлэгдлээ!');
            } else {
                const nextId = state.factChecks.reduce((m, f) => Math.max(m, f.id), 0) + 1;
                state.factChecks.push({ id: nextId, ...fData });
                showToast('Шинэ баримт нэмэгдлээ!');
            }
            saveState();
            render();
        }

        function deleteFact(id) {
            state.factChecks = state.factChecks.filter(f => f.id !== id);
            saveState();
            showToast('Баримт устгагдлаа.', 'info');
            render();
        }

        function handleEditJeopardy(e) {
            e.preventDefault();
            const jq = state.jeopardyBoard[ui.adminJeopCat].questions[ui.adminJeopRow];
            jq.syllabus = document.getElementById('jqSyl').value.trim();
            jq.qMn = document.getElementById('jqMn').value.trim();
            jq.qEn = document.getElementById('jqEn').value.trim();
            jq.hint = document.getElementById('jqHint').value.trim();
            jq.answer = document.getElementById('jqAns').value.trim();
            saveState();
            showToast('Jeopardy асуулт амжилттай хадгалагдлаа!');
            render();
        }

        function handleAddKeyword(e) {
            e.preventDefault();
            state.keywords.push({
                id: 'kw_' + Date.now(),
                term: document.getElementById('nkwTerm').value.trim(),
                chapter: document.getElementById('nkwChap').value.trim(),
                mn: document.getElementById('nkwMn').value.trim(),
                example: document.getElementById('nkwEx').value.trim()
            });
            saveState();
            showToast('Шинэ Keyword нэмэгдлээ!');
            render();
        }

        function exportFullJson() {
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Grade7_CS_360_Backup.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('JSON нөөц файл татагдлаа!');
        }

        function importFullJson(e) {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const parsed = JSON.parse(ev.target.result);
                    if (parsed.students && parsed.questions) {
                        state = { ...DEFAULT_STATE, ...parsed };
                        saveState();
                        showToast('JSON өгөгдөл амжилттай сэргээгдлээ!');
                        render();
                    } else {
                        showToast('Буруу JSON бүтэц байна!', 'error');
                    }
                } catch (err) {
                    showToast('JSON уншихад алдаа гарлаа!', 'error');
                }
            };
            reader.readAsText(file);
        }

        function resetPlatformDefaults() {
            openConfirm('Анхны өгөгдөл рүү сэргээх үү?', 'Бүх оноо, сурагчид болон асуултууд 7-р ангийн анхны төлөвт орно.', () => {
                localStorage.removeItem(STORAGE_KEY);
                state = JSON.parse(JSON.stringify(DEFAULT_STATE));
                saveState();
                showToast('Анхны өгөгдөл сэргээгдлээ!');
                render();
            });
        }

        function handleChangePin(e) {
            e.preventDefault();
            const np = document.getElementById('newPinBox').value.trim();
            if (np.length >= 4) {
                state.adminPin = np;
                saveState();
                showToast('Админ PIN код солигдлоо!');
                render();
            }
        }

                }
            }

            // 3. Confirmation Modal
            if (ui.confirmModal) {
                html += `
                    <div class="modal-backdrop" onclick="ui.confirmModal=null; render();">
                        <div class="modal-card" style="max-width:420px; text-align:center;" onclick="event.stopPropagation();">
                            <h3 style="font-size:18px; font-weight:800; margin-bottom:8px;">${escapeHtml(ui.confirmModal.title)}</h3>
                            <p style="font-size:13.5px; color:#475569; margin-bottom:18px;">${escapeHtml(ui.confirmModal.message)}</p>
                            <div style="display:flex; justify-content:center; gap:8px;">
                                <button class="btn btn-outline" onclick="ui.confirmModal=null; render();">Болих</button>
                                <button class="btn btn-rose" onclick="const fn=ui.confirmModal.onConfirm; ui.confirmModal=null; fn();">Тийм, баталгаажуулах</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            return html;
        }

        /* ==========================================================================
           7. MAIN RENDER ORCHESTRATOR
           ========================================================================== */
        function render() {
            const appEl = document.getElementById('app');
            if (!appEl) return;

            // Render Login Flow if active
            if (ui.view === 'login') {
                appEl.innerHTML = `
                    ${renderLoginScreen()}
                    <div id="toast-root" class="toast-container"></div>
                `;
                return;
            }

            // Render App
            let activeViewHtml = '';
            if (ui.activeTab === 'wheel') activeViewHtml = renderWheelModule();
            else if (ui.activeTab === 'jeopardy') activeViewHtml = renderJeopardyModule();
            else if (ui.activeTab === 'keywords') activeViewHtml = renderKeywordsModule();
            else if (ui.activeTab === 'leaderboard') activeViewHtml = renderLeaderboardModule();
            else if (ui.activeTab === 'quiz') activeViewHtml = renderQuizAndFactModule();
            else if (ui.activeTab === 'rocket') activeViewHtml = renderRocketModule();
            else if (ui.activeTab === 'analytics') activeViewHtml = renderAnalyticsModule();
            else if (ui.activeTab === 'admin') activeViewHtml = renderAdminModule();

            appEl.innerHTML = `
                ${renderHeader()}
                ${renderNavBar()}
                <main class="main-container">
                    ${activeViewHtml}
                </main>
                ${renderModals()}
                <div id="toast-root" class="toast-container"></div>
            `;
        }

        // Initial Boot
        render();
    </script>
</body>
</html>
